<!DOCTYPE html>
<html>
<head>
    <title>My Games Lobby</title>
</head>
<body>
    <!-- THIS SECTION IS HIDDEN UNTIL LOGIN -->
<div id="games-section" style="display: none;">
    <h1>Welcome to My Games Collection</h1>
    <p>Click a link below to Play a Game:</p>
    <ul>
        <li><a href="./site-a/">Go to Website A</a></li>
        <li><a href="./site-b/">Go to Website B</a></li>
        <li><a href="./site-c/">Go to Website C</a></li>
             </ul>
    <hr>
</div>
    
    <!-- === ADD THIS SECTION FOR LOGIN/SIGNUP === -->
<!-- THIS SECTION IS VISIBLE WHEN LOGGED OUT -->
<div id="login-section">
    <h2>Account Login & Sign Up</h2>
    
</div>

    <!-- SIGN UP FORM -->
    <h3>Create New Account</h3>
    <form id="signupForm">
        <input type="email" id="signupEmail" placeholder="Email" required><br>
        <input type="password" id="signupPassword" placeholder="Password (min. 6 chars)" required><br>
        <button type="submit">Sign Up</button>
    </form>
    <p id="signupMessage" style="color: blue;"></p>

    <hr>

    <!-- LOGIN FORM -->
    <h3>Existing User Login</h3>
    <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required><br>
        <input type="password" id="loginPassword" placeholder="Password" required><br>
        <button type="submit">Log In</button>
    </form>
    <p id="loginMessage" style="color: blue;"></p>

    <!-- USER STATUS AREA -->
    <div id="userStatus">
        <p>No user is currently logged in.</p>
    </div>
</div>
<!-- === END OF AUTH SECTION === -->
    <!-- Add the Firebase SDKs from CDN -->
<!-- REPLACE WITH THESE CORRECT SDK SCRIPTS -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  // Your web app's Firebase configuration (COPY YOUR OWN FROM THE CONSOLE)
  const firebaseConfig = {
    apiKey: "AIzaSyAh8vyJXO2QX2XUas0hZwMqcOxunuBj6wA",
    authDomain: "fun-games-login.firebaseapp.com",
    projectId: "fun-games-login",
    storageBucket: "fun-games-login.firebasestorage.app",
    messagingSenderId: "417995137812",
    appId: "1:417995137812:web:6a71a166d762b2cb679801"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  
  // Make the auth service available (this is the older, simpler syntax)
  const auth = firebase.auth();
    // === ADD THIS CODE AFTER YOUR 'const auth = ...' LINE ===

// Get references to form elements
const signupForm = document.getElementById('signupForm');
const loginForm = document.getElementById('loginForm');
const userStatusDiv = document.getElementById('userStatus');

// 1. Handle NEW USER SIGN UP
signupForm.addEventListener('submit', (event) => {
    event.preventDefault(); // Stop page reload
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;
    const messageEl = document.getElementById('signupMessage');

    auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
            // Success
            messageEl.style.color = 'green';
            messageEl.textContent = `Account created for ${email}!`;
            signupForm.reset();
        })
        .catch((error) => {
            // Handle Errors
            messageEl.style.color = 'red';
            messageEl.textContent = `Sign-up failed: ${error.message}`;
        });
});

// 2. Handle EXISTING USER LOGIN
loginForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const messageEl = document.getElementById('loginMessage');

    auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
            // Success
            messageEl.style.color = 'green';
            messageEl.textContent = `Welcome back, ${email}!`;
            loginForm.reset();
        })
        .catch((error) => {
            // Handle Errors
            messageEl.style.color = 'red';
            messageEl.textContent = `Login failed: ${error.message}`;
        });
});

// 3. Monitor Login State (Show if user is logged in)
// 3. Monitor Login State & Show/Hide Sections
auth.onAuthStateChanged((user) => {
    const loginSection = document.getElementById('login-section');
    const gameSection = document.getElementById('games-section');
    const userStatusDiv = document.getElementById('userStatus');

    if (user) {
        // User IS signed in: SHOW GAMES, HIDE LOGIN
        loginSection.style.display = 'none';   // Hide login forms
        gameSection.style.display = 'block';   // Show game links
        userStatusDiv.innerHTML = `
            <p><strong>Logged in as:</strong> ${user.email}</p>
            <button onclick="firebase.auth().signOut()">Log Out</button>
        `;
    } else {
        // User is NOT signed in: SHOW LOGIN, HIDE GAMES
        loginSection.style.display = 'block';  // Show login forms
        gameSection.style.display = 'none';    // Hide game links
        userStatusDiv.innerHTML = `<p>No user is currently logged in.</p>`;
    }
});
</script>
</body>
</html>
